<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بچوں کا قاعدہ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16264A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap">
<style>
:root{
  --bg:#EAF2FF; --surface:#FFFFFF; --ink:#16264A; --muted:#566A94; --edge:#CBD8F2;
  --line:#8FB0EA; --mid:#F0A0A8; --guide-dot:#6B82BA; --guide-fill:#EEF3FD;
  --accent:#FFC53D; --accent-ink:#2B2100; --ok:#1F8F4E; --ok-bg:#DDF4E6;
  --c0:#2447D6; --c1:#D6333D; --c2:#1E9A52; --c3:#8A3FC7;
}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Andika','Noto Naskh Arabic',system-ui,sans-serif;
  font-size:17px; line-height:1.9; margin:0;
  padding:14px 16px 96px 16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{max-width:560px; margin-inline:auto; display:grid; gap:12px}
h1{margin:0; font-size:26px; font-weight:700; text-align:center}
button{font:inherit; color:inherit}
.btn{
  min-height:52px; padding:0 16px; border-radius:14px; border:2px solid var(--edge);
  background:var(--surface); color:var(--ink); font-size:18px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
.btn.small{min-height:44px; padding:0 12px; font-size:15px}

.tabs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; direction:ltr}
.tab{
  min-height:58px; border-radius:12px; border:2px solid var(--edge); background:var(--surface);
  font-size:16px; font-weight:700; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.tab small{font-size:12px; font-weight:400}
.tab[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}

.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--surface); border-top:2px solid var(--edge);
  padding:8px 16px;
}
.dock .tabs{max-width:560px; margin-inline:auto}
.board{background:var(--surface); border:2px solid var(--edge); border-radius:20px; padding:12px; display:grid; gap:10px}
.meta{display:flex; align-items:center; justify-content:space-between}
.urname{font-size:24px; font-weight:700}
.count{color:var(--muted); font-size:14px; direction:ltr}

.pad{position:relative; width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:var(--surface); border:2px solid var(--edge)}
.pad canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
#ink{touch-action:none; cursor:crosshair}
.status{margin:0; text-align:center; color:var(--muted); font-size:15px; min-height:1.8em}
.status.ok{color:var(--ok); font-weight:700}

.tools{display:flex; align-items:center; justify-content:space-between; gap:10px}
.crayons{display:flex; gap:8px}
.crayon{width:38px; height:38px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 2px var(--edge); cursor:pointer}
.crayon[aria-checked="true"]{box-shadow:0 0 0 4px var(--ink)}

.nav{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.strip{display:flex; gap:8px; overflow-x:auto; direction:ltr; padding:4px 2px}
.chip{
  flex:0 0 auto; width:44px; height:44px; border-radius:10px; border:2px solid var(--edge);
  background:var(--surface); font-size:17px; font-weight:700; cursor:pointer;
}
.chip.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent)}
</style>
</head>
<body>
<main class="app" lang="ur" dir="rtl">
  <h1>بچوں کا قاعدہ</h1>

  <section class="board">
    <div class="meta">
      <button class="btn small" id="speak" type="button">🔊 سنیں</button>
      <span class="urname" id="urname">أ</span>
      <span class="count" id="count">1 / 28</span>
    </div>

    <div class="pad" id="pad">
      <canvas id="guide"></canvas>
      <canvas id="ink"></canvas>
    </div>

    <p class="status" id="status">انگلی سے نقطوں کے اوپر لکھیں</p>

    <div class="tools">
      <div class="crayons">
        <button class="crayon" role="radio" aria-checked="true" data-c="0" style="background:var(--c0)"></button>
        <button class="crayon" role="radio" aria-checked="false" data-c="1" style="background:var(--c1)"></button>
        <button class="crayon" role="radio" aria-checked="false" data-c="2" style="background:var(--c2)"></button>
        <button class="crayon" role="radio" aria-checked="false" data-c="3" style="background:var(--c3)"></button>
      </div>
      <button class="btn small" id="clear" type="button">صاف کریں</button>
    </div>
  </section>

  <nav class="nav">
    <button class="btn" id="prev" type="button">پچھلا</button>
    <button class="btn primary" id="next" type="button">اگلا</button>
  </nav>

  <div class="strip" id="strip"></div>
</main>

<div class="dock" lang="ur" dir="rtl">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-kind="L" aria-selected="true"><span>أ ب ت</span><small>حروف</small></button>
    <button class="tab" role="tab" data-kind="J" aria-selected="false"><span>بَا تَا</span><small>مرکبات</small></button>
    <button class="tab" role="tab" data-kind="N" aria-selected="false"><span>١ ٢ ٣</span><small>گنتی</small></button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var AR_LETTERS = [
    {ch:"أ", ur:"ألف"}, {ch:"ب", ur:"باء"}, {ch:"ت", ur:"تاء"}, {ch:"ث", ur:"ثاء"},
    {ch:"ج", ur:"جيم"}, {ch:"ح", ur:"حاء"}, {ch:"خ", ur:"خاء"}, {ch:"د", ur:"دال"},
    {ch:"ذ", ur:"ذال"}, {ch:"ر", ur:"راء"}, {ch:"ز", ur:"زاي"}, {ch:"س", ur:"سين"},
    {ch:"ش", ur:"شين"}, {ch:"ص", ur:"صاد"}, {ch:"ض", ur:"ضاد"}, {ch:"ط", ur:"طاء"},
    {ch:"ظ", ur:"ظاء"}, {ch:"ع", ur:"عين"}, {ch:"غ", ur:"غين"}, {ch:"ف", ur:"فاء"},
    {ch:"ق", ur:"قاف"}, {ch:"ك", ur:"كاف"}, {ch:"ل", ur:"لام"}, {ch:"م", ur:"ميم"},
    {ch:"ن", ur:"نون"}, {ch:"هـ", ur:"هاء"}, {ch:"و", ur:"واو"}, {ch:"ي", ur:"ياء"}
  ];

  var AR_JOINTS = [
    {ch:"بَا", ur:"باء الف با"}, {ch:"تَا", ur:"تاء الف تا"}, {ch:"ثَا", ur:"ثاء الف ثا"},
    {ch:"جَا", ur:"جيم الف جا"}, {ch:"حَا", ur:"حاء الف حا"}, {ch:"خَا", ur:"حاء الف خا"},
    {ch:"دَا", ur:"دال الف دا"}, {ch:"رَا", ur:"راء الف را"}, {ch:"سَا", ur:"سين الف سا"}
  ];

  var AR_NUMS = [];
  for(var i=1; i<=10; i++){ AR_NUMS.push({ch: String(i), ur: "عدد " + i}); }

  var mode = 'L', idx = 0, color = 0, strokes = [];
  var S = 300, dpr = 1;
  var pad = document.getElementById('pad'), guide = document.getElementById('guide'), inkC = document.getElementById('ink');
  var g = guide.getContext('2d'), ictx = inkC.getContext('2d');
  var strokeC = document.createElement('canvas'), sctx = strokeC.getContext('2d');

  function items(){
    if(mode === 'L') return AR_LETTERS;
    if(mode === 'J') return AR_JOINTS;
    return AR_NUMS;
  }
  function cur(){ return items()[idx]; }
  function crayon(i){ return getComputedStyle(document.documentElement).getPropertyValue('--c'+i).trim(); }

  function setSize(){
    var r = pad.getBoundingClientRect();
    S = Math.max(160, Math.round(r.width));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    [guide, inkC, strokeC].forEach(function(c){ c.width = Math.round(S * dpr); c.height = Math.round(S * dpr); });
    drawGuide(); redrawInk();
  }

  function drawGuide(){
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,S,S);
    var ch = cur().ch, fs = S * 0.45;
    g.font = '700 '+fs+'px "Noto Naskh Arabic", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = '#EEF3FD'; g.fillText(ch, S/2, S/2);
    g.lineWidth = Math.max(3, S * 0.015); g.strokeStyle = '#6B82BA'; g.setLineDash([4, 6]);
    g.strokeText(ch, S/2, S/2); g.setLineDash([]);
  }

  function redrawInk(){
    ictx.setTransform(dpr,0,0,dpr,0,0); ictx.clearRect(0,0,S,S);
    strokes.forEach(function(s){
      ictx.strokeStyle = crayon(s.c); ictx.lineWidth = S * 0.07; ictx.lineCap = 'round'; ictx.lineJoin = 'round';
      if(s.pts.length){
        ictx.beginPath(); ictx.moveTo(s.pts[0][0]*S, s.pts[0][1]*S);
        for(var i=1; i<s.pts.length; i++) ictx.lineTo(s.pts[i][0]*S, s.pts[i][1]*S);
        ictx.stroke();
      }
    });
  }

  var drawing = false, curStroke = null;
  function pos(e){
    var r = inkC.getBoundingClientRect();
    return [(e.clientX - r.left)/r.width, (e.clientY - r.top)/r.height];
  }

  inkC.addEventListener('pointerdown', function(e){
    e.preventDefault(); drawing = true;
    curStroke = {c: color, pts: [pos(e)]}; strokes.push(curStroke); redrawInk();
  });
  inkC.addEventListener('pointermove', function(e){
    if(!drawing || !curStroke) return;
    e.preventDefault(); curStroke.pts.push(pos(e)); redrawInk();
  });
  inkC.addEventListener('pointerup', function(){
    if(!drawing) return; drawing = false;
    document.getElementById('status').textContent = "شاباش! بہت اچھا لکھا۔";
    document.getElementById('status').className = 'status ok';
  });

  function speak(){
    var it = cur(), txt = it.ch + ", " + it.ur;
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(txt);
      u.lang = 'ar-SA';
      window.speechSynthesis.speak(u);
    }
  }

  function buildStrip(){
    var s = document.getElementById('strip'); s.innerHTML = '';
    items().forEach(function(it, i){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip' + (i === idx ? ' on' : '');
      b.textContent = it.ch; b.addEventListener('click', function(){ idx = i; loadItem(); });
      s.appendChild(b);
    });
  }

  function updateUI(){
    var it = cur();
    document.getElementById('urname').textContent = it.ch + ' — ' + it.ur;
    document.getElementById('count').textContent = (idx + 1) + ' / ' + items().length;
    buildStrip();
  }

  function loadItem(){
    strokes = [];
    drawGuide(); redrawInk();
    document.getElementById('status').textContent = "انگلی سے نقطوں کے اوپر لکھیں";
    document.getElementById('status').className = 'status';
    updateUI();
  }

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      mode = t.dataset.kind; idx = 0;
      document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-selected', x === t ? 'true' : 'false'); });
      loadItem();
    });
  });

  document.getElementById('prev').addEventListener('click', function(){ if(idx > 0){ idx--; loadItem(); } });
  document.getElementById('next').addEventListener('click', function(){ if(idx < items().length - 1){ idx++; loadItem(); } });
  document.getElementById('speak').addEventListener('click', speak);
  document.getElementById('clear').addEventListener('click', function(){ strokes = []; redrawInk(); });

  document.querySelectorAll('.crayon').forEach(function(b){
    b.addEventListener('click', function(){
      color = parseInt(b.dataset.c, 10);
      document.querySelectorAll('.crayon').forEach(function(x){ x.setAttribute('aria-checked', x === b ? 'true' : 'false'); });
    });
  });

  window.addEventListener('resize', setSize);
  setSize(); loadItem();
})();
</script>
</body>
</html>
